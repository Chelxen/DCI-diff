
dataset: GE
raw_data: true

#### datasets
datasets:
  train:
    dist: False
    root: data/GE/train
    train_low_dir: limited_npy_120
    train_high_dir: full_npy
    use_shuffle: true
    n_workers: 4  
    batch_size: 16
    use_flip: true
    use_rot: true
    use_crop: true
    patch_size: 256

  val:
    dist: False
    root: data/GE/test
    patient_ids: null   # null = all patients; or e.g. ["<ID>"] to match files <ID>_000.npy, ...
    test_low_dir: limited_npy_120
    test_high_dir: full_npy
    n_workers: 1
    use_crop: false
    batch_size: 1 

